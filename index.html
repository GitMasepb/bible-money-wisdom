<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible &amp; Money Wisdom</title>
<style>
:root{--blue:#1d4ed8;--blue-dark:#1e3a8a;--blue-mid:#3b82f6;--blue-soft:#dbeafe;--blue-pale:#eff6ff;--white:#fff;--ink:#0f1f45;--muted:#475a82;--line:#bfd3f7}
*{box-sizing:border-box}
body{margin:0;background:var(--blue-pale);color:var(--ink);font:18px/1.6 Georgia,"Times New Roman",serif}
header{background:var(--blue-dark);color:var(--white);text-align:center;padding:48px 20px 40px}
h1{margin:0;font-size:2.6rem;letter-spacing:.01em}
header p{margin:12px auto 0;max-width:680px;color:var(--blue-soft);font-size:1.1rem}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.cats{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:-28px auto 0;padding:0 20px;max-width:1200px}
.cat{appearance:none;border:2px solid var(--line);background:var(--white);color:var(--blue-dark);font:600 1.05rem Georgia,serif;padding:16px 26px;border-radius:14px;cursor:pointer;box-shadow:0 4px 12px rgba(30,58,138,.12);transition:transform .12s,background .12s,color .12s,border-color .12s}
.cat:hover{border-color:var(--blue-mid);transform:translateY(-2px)}
.cat:focus-visible{outline:3px solid var(--blue-mid);outline-offset:2px}
.cat[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--white)}
.cat small{display:block;font:500 .78rem Georgia,serif;opacity:.75;margin-top:2px}
#panel{background:var(--white);border:2px solid var(--line);border-radius:18px;margin:32px auto 24px;padding:36px;max-width:1200px;box-shadow:0 8px 24px rgba(30,58,138,.08)}
#panel h2{margin:0;font-size:2rem;color:var(--blue-dark)}
#panel .blurb{margin:6px 0 24px;color:var(--muted);font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.verse{background:var(--blue-pale);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:16px 18px}
.ref a{color:var(--blue);font-weight:700;text-decoration:none;border-bottom:1px dotted currentColor}
.ref a:hover{color:var(--blue-dark)}
.vt{margin:8px 0 0}
.pending{margin:8px 0 0;color:var(--muted);font-style:italic;font-size:.95rem}
.empty{color:var(--muted);font-size:1.15rem;text-align:center;margin:20px 0}
footer{text-align:center;padding:8px 20px 40px;font-size:.9rem}
footer a{color:var(--blue);text-decoration:none;border-bottom:1px dotted currentColor}
@media (max-width:600px){h1{font-size:2rem}#panel{padding:22px 18px}.cat{padding:12px 16px;font-size:.95rem}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Bible &amp; Money Wisdom</h1>
  <p>Choose a theme to see what Scripture says about it as it relates to money and finances.</p>
</header>
<nav class="cats" id="cats" aria-label="Topics"></nav>
<section id="panel" aria-live="polite"><p class="empty">Select a topic above to see related verses.</p></section>
<footer><a href="https://www.crossway.org/" target="_blank" rel="noopener">ESV&reg; Bible &middot; Crossway</a></footer>
<script src="verses.js"></script>
<script>
(function(){
  const D = window.DATA, cats = document.getElementById("cats"), panel = document.getElementById("panel");
  const esvUrl = r => "https://www.esv.org/" + encodeURIComponent(r.replace(/ /g, "+")).replace(/%2B/g, "+") + "/";
  const btns = {};
  D.topics.forEach(t => {
    const b = document.createElement("button");
    b.className = "cat"; b.type = "button"; b.setAttribute("aria-pressed", "false");
    b.textContent = t.label;
    b.addEventListener("click", () => select(t.id));
    cats.appendChild(b); btns[t.id] = b;
  });

  function select(id) {
    const t = D.topics.find(x => x.id === id);
    Object.entries(btns).forEach(([k, b]) => b.setAttribute("aria-pressed", k === id ? "true" : "false"));
    panel.innerHTML = "";
    const h = document.createElement("h2"); h.textContent = t.label; panel.appendChild(h);
    const p0 = document.createElement("p"); p0.className = "blurb"; p0.textContent = t.blurb; panel.appendChild(p0);
    const g = document.createElement("div"); g.className = "grid"; panel.appendChild(g);
    t.refs.forEach(r => {
      const d = document.createElement("div"); d.className = "verse";
      const rf = document.createElement("div"); rf.className = "ref";
      const a = document.createElement("a"); a.href = esvUrl(r); a.target = "_blank"; a.rel = "noopener"; a.textContent = r + " (ESV)";
      rf.appendChild(a); d.appendChild(rf);
      const p = document.createElement("p");
      if (D.texts[r]) { p.className = "vt"; p.textContent = D.texts[r]; }
      else { p.className = "pending"; p.textContent = "Open the reference to read the passage."; }
      d.appendChild(p); g.appendChild(d);
    });
    history.replaceState(null, "", "#" + id);
  }

  const start = location.hash.slice(1);
  if (D.topics.some(t => t.id === start)) select(start);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible &amp; Money Wisdom</title>
<style>
:root{--blue:#1d4ed8;--blue-dark:#1e3a8a;--blue-mid:#3b82f6;--blue-soft:#dbeafe;--blue-pale:#eff6ff;--white:#fff;--ink:#0f1f45;--muted:#475a82;--line:#bfd3f7}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cat{transition:none}}
body{margin:0;background:var(--blue-pale);color:var(--ink);font:18px/1.6 Georgia,"Times New Roman",serif}
header{background:var(--blue-dark);color:var(--white);text-align:center;padding:48px 20px 40px}
h1{margin:0;font-size:2.6rem;letter-spacing:.01em}
header p{margin:12px auto 0;max-width:680px;color:var(--blue-soft);font-size:1.1rem}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:1200px;margin:0 auto;padding:32px 20px 0}
.group h2{margin:0 0 10px;font:700 .8rem Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cat{appearance:none;border:2px solid var(--line);background:var(--white);color:var(--blue-dark);font:600 1rem Georgia,serif;min-height:46px;padding:9px 18px;border-radius:12px;cursor:pointer;box-shadow:0 3px 8px rgba(30,58,138,.1);transition:transform .12s,background .12s,color .12s,border-color .12s}
.cat:hover{border-color:var(--blue-mid);transform:translateY(-2px)}
.cat:focus-visible,.more:focus-visible,.verse a:focus-visible,footer a:focus-visible,#panel h2:focus-visible{outline:3px solid var(--blue-mid);outline-offset:2px}
.cat[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--white)}
#panel{background:var(--white);border:2px solid var(--line);border-radius:18px;margin:28px auto 24px;padding:36px;max-width:1200px;box-shadow:0 8px 24px rgba(30,58,138,.08);scroll-margin-top:16px}
#panel h2{margin:0;font-size:2rem;color:var(--blue-dark)}
#panel h2:focus{outline:none}
#panel .blurb{margin:6px 0 4px;color:var(--muted);font-size:1.1rem}
#panel .note{margin:0 0 22px;color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.verse{background:var(--blue-pale);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.verse .top{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.verse .ref{margin:0;font-weight:700;color:var(--blue-dark);font-size:1.15rem}
.verse .tag{font:600 .74rem Georgia,serif;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-dark);background:var(--blue-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.verse .vt{margin:0;flex:1}
.verse a{align-self:flex-start;color:var(--blue);font-size:.92rem;font-weight:600;text-decoration:none;border-bottom:1px dotted currentColor;min-height:24px}
.verse a:hover{color:var(--blue-dark)}
.more{display:block;margin:22px auto 0;appearance:none;border:2px solid var(--blue);background:var(--white);color:var(--blue);font:600 1rem Georgia,serif;min-height:46px;padding:9px 24px;border-radius:12px;cursor:pointer}
.more:hover{background:var(--blue);color:var(--white)}
.empty,.err{color:var(--muted);font-size:1.15rem;text-align:center;margin:20px 0}
.err{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer{text-align:center;padding:8px 20px 40px;font-size:.9rem}
footer a{color:var(--blue);text-decoration:none;border-bottom:1px dotted currentColor}
@media (max-width:820px){.cats{grid-template-columns:1fr;gap:18px;padding-top:24px}}
@media (max-width:600px){h1{font-size:2rem}header{padding:36px 16px 30px}#panel{padding:22px 18px;margin-left:12px;margin-right:12px}.grid{grid-template-columns:1fr}.cat{padding:8px 14px;font-size:.95rem}}
</style>
</head>
<body>
<header>
  <h1>Bible &amp; Money Wisdom</h1>
  <p>Choose a theme to see what Scripture says about it as it relates to money and finances.</p>
</header>
<nav class="cats" id="cats" aria-label="Topics"></nav>
<div id="status" class="sr" role="status"></div>
<section id="panel" aria-label="Passages for the selected topic"><p class="empty">Select a topic above to see related verses.</p></section>
<footer><a href="https://www.crossway.org/" target="_blank" rel="noopener">ESV&reg; Bible &middot; Crossway</a></footer>
<script src="verses.js"></script>
<script>
(function(){
  var panel = document.getElementById("panel"), cats = document.getElementById("cats"), status = document.getElementById("status");
  var D = window.DATA;
  if (!D || !D.topics) {
    cats.hidden = true;
    panel.innerHTML = '<p class="err">The verses could not load. Please refresh the page, or try again in a moment.</p>';
    return;
  }
  var SHOW = 6, btns = {};
  var texts = D.texts || {}, tags = D.tags || {};
  var esvUrl = function(r){ return "https://www.esv.org/" + encodeURIComponent(r.replace(/ /g, "+")).replace(/%2B/g, "+") + "/"; };
  var hasText = Object.keys(texts).length > 0;

  // Topics grouped into families (each group has 5 or fewer choices)
  var groups = [], gmap = {};
  D.topics.forEach(function(t){
    var g = t.group || "Topics";
    if (!gmap[g]) { gmap[g] = {name: g, topics: []}; groups.push(gmap[g]); }
    gmap[g].topics.push(t);
  });
  groups.forEach(function(g, gi){
    var wrap = document.createElement("div"); wrap.className = "group";
    wrap.setAttribute("role", "group"); wrap.setAttribute("aria-labelledby", "grp" + gi);
    var h = document.createElement("h2"); h.id = "grp" + gi; h.textContent = g.name; wrap.appendChild(h);
    var chips = document.createElement("div"); chips.className = "chips"; wrap.appendChild(chips);
    g.topics.forEach(function(t){
      var b = document.createElement("button");
      b.className = "cat"; b.type = "button"; b.setAttribute("aria-pressed", "false"); b.textContent = t.label;
      b.addEventListener("click", function(){ select(t.id, true); });
      chips.appendChild(b); btns[t.id] = b;
    });
    cats.appendChild(wrap);
  });

  function card(r){
    var d = document.createElement("div"); d.className = "verse";
    var top = document.createElement("div"); top.className = "top";
    var ref = document.createElement("p"); ref.className = "ref"; ref.textContent = r; top.appendChild(ref);
    if (tags[r]) { var tg = document.createElement("span"); tg.className = "tag"; tg.textContent = tags[r]; top.appendChild(tg); }
    d.appendChild(top);
    if (texts[r]) {
      var body = document.createElement("p"); body.className = "vt"; body.textContent = texts[r]; d.appendChild(body);
    }
    var a = document.createElement("a");
    a.href = esvUrl(r); a.target = "_blank"; a.rel = "noopener";
    a.textContent = (texts[r] ? "Read in context" : "Read the full verse") + " ↗";
    a.setAttribute("aria-label", (texts[r] ? "Read " : "Read the full text of ") + r + " on esv.org (opens in a new tab)");
    d.appendChild(a);
    return d;
  }

  function select(id, userClick){
    var t = D.topics.filter(function(x){ return x.id === id; })[0];
    if (!t) return;
    Object.keys(btns).forEach(function(k){ btns[k].setAttribute("aria-pressed", k === id ? "true" : "false"); });
    panel.innerHTML = "";
    panel.setAttribute("aria-label", t.label + " passages");
    var h = document.createElement("h2"); h.textContent = t.label; h.tabIndex = -1; h.id = "panel-title"; panel.appendChild(h);
    var b = document.createElement("p"); b.className = "blurb"; b.textContent = t.blurb; panel.appendChild(b);
    var g = document.createElement("div"); g.className = "grid"; panel.appendChild(g);
    var shown = Math.min(SHOW, t.refs.length);
    t.refs.slice(0, shown).forEach(function(r){ g.appendChild(card(r)); });
    if (t.refs.length > shown) {
      var m = document.createElement("button"); m.type = "button"; m.className = "more";
      m.textContent = "Show all " + t.refs.length + " passages";
      m.addEventListener("click", function(){
        var first = g.children.length;
        t.refs.slice(shown).forEach(function(r){ g.appendChild(card(r)); });
        m.remove();
        status.textContent = "Showing all " + t.refs.length + " passages";
      });
      panel.appendChild(m);
    }
    status.textContent = t.label + ": " + t.refs.length + " passages";
    history.replaceState(null, "", "#" + id);
    if (userClick) {
      panel.scrollIntoView({block: "start"});
      h.focus({preventScroll: true});
    }
  }

  var start = location.hash.slice(1);
  if (D.topics.some(function(t){ return t.id === start; })) select(start, false);
})();
</script>
</body>
</html>
